<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGen Pro - Administrasi Guru Kurikulum Merdeka</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a',
                        accent: '#2563eb',
                        paper: '#ffffff',
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .font-serif { font-family: 'Noto Serif', serif; }
        
        /* A4 Paper Simulation */
        .a4-paper {
            background: white;
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Print Styling */
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 100%; 
                padding: 0;
                margin: 0;
                background: white;
            }
            .no-print { display: none !important; }
            .page-break { page-break-before: always; }
        }

        /* Editable Content Visual Cues */
        [contenteditable]:focus {
            outline: 2px dashed #94a3b8;
            background-color: #f8fafc;
            padding: 2px;
        }
        [contenteditable]:hover {
            background-color: #f8fafc;
            cursor: text;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DATABASE SIMPLE CP (CAPAIAN PEMBELAJARAN) ---
        const cpDatabase = {
            "Matematika": {
                "A": "Peserta didik dapat menunjukkan pemahaman dan intuisi bilangan (number sense) pada bilangan cacah sampai 100, melakukan operasi penjumlahan dan pengurangan.",
                "B": "Peserta didik dapat menggeneralisasi pemahaman dan melakukan operasi hitung bilangan cacah sampai dengan 1.000.000.",
                "C": "Peserta didik dapat melakukan operasi hitung pecahan, desimal, dan persen serta memahami konsep bangun ruang.",
                "D": "Peserta didik dapat menggunakan pola, aljabar, dan fungsi untuk menyelesaikan masalah bilangan, aritmatika sosial, dan geometri.",
                "E": "Peserta didik dapat menggeneralisasi sifat-sifat operasi bilangan berpangkat (eksponen) dan logaritma.",
                "F": "Peserta didik dapat memodelkan fenomena hubungan antara dua besaran dengan menggunakan fungsi linear, kuadrat, dan eksponensial."
            },
            "Bahasa Indonesia": {
                "A": "Peserta didik mampu bersikap menjadi pendengar yang penuh perhatian, menunjukkan minat pada tuturan yang didengar.",
                "B": "Peserta didik mampu memahami dan menyampaikan gagasan dari teks informatif serta memahami instruksi lisan.",
                "C": "Peserta didik mampu menganalisis informasi berupa fakta, prosedur dengan mengidentifikasikan ciri objek dan urutan proses.",
                "D": "Peserta didik mampu menganalisis dan mengevaluasi informasi berupa gagasan, pikiran, perasaan, pandangan, arahan atau pesan.",
                "E": "Peserta didik mampu mengevaluasi dan mengkreasi informasi berupa gagasan, pikiran, perasaan, pandangan, arahan atau pesan.",
                "F": "Peserta didik mampu mengolah dan menyajikan gagasan, pikiran, pandangan, arahan atau pesan untuk tujuan pengajuan usul."
            },
            // Default fallback
            "default": "Peserta didik memiliki kemampuan literasi dan numerasi yang sesuai dengan tahap perkembangannya serta menunjukkan karakter Profil Pelajar Pancasila."
        };

        const syntaxModels = {
            "Problem Based Learning (PBL)": [
                { stage: "Orientasi Masalah", desc: "Guru menyajikan masalah nyata terkait [TOPIK] kepada peserta didik." },
                { stage: "Organisasi Belajar", desc: "Peserta didik dibagi ke kelompok, mendefinisikan masalah, dan membagi tugas." },
                { stage: "Penyelidikan", desc: "Peserta didik mengumpulkan informasi, referensi, dan data untuk memecahkan masalah." },
                { stage: "Pengembangan Hasil", desc: "Kelompok berdiskusi mengolah data dan menyusun laporan/karya hasil diskusi." },
                { stage: "Evaluasi & Refleksi", desc: "Setiap kelompok mempresentasikan hasil, kelompok lain menanggapi, guru memberi penguatan." }
            ],
            "Project Based Learning (PjBL)": [
                { stage: "Pertanyaan Mendasar", desc: "Guru memberikan pertanyaan esensial yang memantik siswa membuat proyek [TOPIK]." },
                { stage: "Desain Perencanaan", desc: "Siswa menyusun aturan main, pemilihan alat bahan, dan desain proyek." },
                { stage: "Menyusun Jadwal", desc: "Siswa dan guru menyepakati timeline penyelesaian proyek." },
                { stage: "Monitor Kemajuan", desc: "Guru memantau keaktifan dan perkembangan proyek siswa." },
                { stage: "Menguji Hasil", desc: "Membahas kelayakan proyek yang telah dibuat dan membuat laporan produk." },
                { stage: "Evaluasi Pengalaman", desc: "Evaluasi dan refleksi dari kegiatan dan hasil proyek." }
            ],
            "Discovery Learning": [
                { stage: "Stimulation", desc: "Pemberian rangsangan/pertanyaan terkait [TOPIK]." },
                { stage: "Problem Statement", desc: "Identifikasi masalah dan hipotesis sementara." },
                { stage: "Data Collection", desc: "Mengumpulkan data melalui eksperimen atau literasi." },
                { stage: "Data Processing", desc: "Mengolah data yang diperoleh untuk menjawab hipotesis." },
                { stage: "Verification", desc: "Membuktikan benar tidaknya hipotesis." },
                { stage: "Generalization", desc: "Menarik kesimpulan dari hasil pembelajaran." }
            ]
        };

        // --- ICONS COMPONENT ---
        const Icon = ({ name, size = 18, className }) => {
            const lucideRef = useRef(null);
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- UTILS ---
        const getFase = (kelas) => {
            if (kelas <= 2) return "A";
            if (kelas <= 4) return "B";
            if (kelas <= 6) return "C";
            if (kelas <= 9) return "D";
            if (kelas <= 10) return "E";
            return "F";
        };

        // --- APP COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('input'); 
            const [selectedDoc, setSelectedDoc] = useState('modul');
            const [loading, setLoading] = useState(false);
            
            const [formData, setFormData] = useState({
                namaGuru: "",
                nip: "",
                sekolah: "",
                kepalaSekolah: "",
                nipKepsek: "",
                mapel: "Matematika",
                kelas: "4",
                semester: "1",
                tahunAjar: "2024/2025",
                topik: "",
                alokasiWaktu: "2 JP x 35 Menit",
                modelPembelajaran: "Problem Based Learning (PBL)",
                metode: "Diskusi, Tanya Jawab, Penugasan"
            });

            const [generatedData, setGeneratedData] = useState(null);

            const handleInputChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleGenerate = () => {
                if (!formData.topik || !formData.mapel) {
                    alert("Mohon lengkapi Mata Pelajaran dan Topik Materi.");
                    return;
                }
                setLoading(true);
                
                setTimeout(() => {
                    const fase = getFase(formData.kelas);
                    const cpKey = cpDatabase[formData.mapel] ? formData.mapel : "default";
                    const cpText = cpDatabase[cpKey][fase] || cpDatabase[cpKey]["default"] || cpDatabase["default"];
                    
                    const modelSteps = syntaxModels[formData.modelPembelajaran] || syntaxModels["Problem Based Learning (PBL)"];
                    const kegiatanInti = modelSteps.map(step => ({
                        stage: step.stage,
                        desc: step.desc.replace("[TOPIK]", formData.topik)
                    }));

                    const newData = {
                        meta: { ...formData, fase, cpText },
                        tujuan: [
                            `Peserta didik mampu menjelaskan konsep ${formData.topik} dengan bahasa sendiri.`,
                            `Peserta didik mampu menganalisis masalah kontekstual yang berkaitan dengan ${formData.topik}.`,
                            `Peserta didik mampu menyajikan hasil pemahaman tentang ${formData.topik} secara kreatif.`
                        ],
                        kegiatan: {
                            pendahuluan: "Guru menyapa, berdoa, mengecek kehadiran, menyampaikan tujuan pembelajaran, dan memberikan pertanyaan pemantik.",
                            inti: kegiatanInti,
                            penutup: "Guru memberikan umpan balik, siswa menyimpulkan materi, refleksi bersama, dan doa penutup."
                        },
                        diferensiasi: {
                            konten: "Menyediakan materi visual (gambar), auditori (penjelasan lisan), dan kinestetik (alat peraga).",
                            proses: "Siswa berkelompok berdasarkan kesiapan belajar (kelompok mahir memimpin diskusi, kelompok butuh bimbingan didampingi guru).",
                            produk: "Siswa bebas memilih bentuk laporan hasil diskusi (poster, presentasi lisan, atau tulisan ringkas)."
                        },
                        asesmen: {
                            awal: "Pertanyaan pemantik lisan di awal sesi.",
                            formatif: "Observasi keaktifan diskusi (Rubrik) dan LKPD.",
                            sumatif: "Tes tertulis pemahaman konsep (Pilihan Ganda & Uraian)."
                        }
                    };
                    
                    setGeneratedData(newData);
                    setLoading(false);
                    setActiveTab('preview');
                }, 1200);
            };

            const printDocument = () => window.print();

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    {/* TOP NAVIGATION */}
                    <nav className="h-16 bg-primary text-white flex items-center justify-between px-6 shadow-md z-20">
                        <div className="flex items-center gap-3">
                            <div className="bg-accent p-1.5 rounded-lg">
                                <Icon name="layout-template" className="text-white" />
                            </div>
                            <div>
                                <h1 className="font-bold text-lg tracking-tight leading-tight">EduGen Pro</h1>
                                <p className="text-xs text-slate-400">Generator Administrasi Merdeka</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden md:flex gap-1 bg-slate-800 p-1 rounded-lg">
                                <button 
                                    onClick={() => setActiveTab('input')}
                                    className={`px-4 py-1.5 text-sm rounded-md transition-all flex items-center gap-2 ${activeTab === 'input' ? 'bg-slate-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    <Icon name="pen-tool" size={14}/> Input Data
                                </button>
                                <button 
                                    onClick={() => {
                                        if(!generatedData) return alert("Generate data dulu!");
                                        setActiveTab('preview');
                                    }}
                                    className={`px-4 py-1.5 text-sm rounded-md transition-all flex items-center gap-2 ${activeTab === 'preview' ? 'bg-accent text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    <Icon name="file-text" size={14}/> Preview Dokumen
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* MAIN WORKSPACE */}
                    <div className="flex-1 flex overflow-hidden">
                        
                        {/* INPUT MODE */}
                        {activeTab === 'input' && (
                            <div className="w-full overflow-y-auto bg-slate-50 p-6">
                                <div className="max-w-4xl mx-auto">
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="p-6 border-b border-slate-100 bg-slate-50/50">
                                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                                <Icon name="settings-2" className="text-accent"/> Parameter Pembelajaran
                                            </h2>
                                            <p className="text-slate-500 text-sm mt-1">Isi data inti untuk meracik dokumen secara otomatis.</p>
                                        </div>
                                        
                                        <div className="p-8 grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                                            {/* Data Sekolah */}
                                            <div className="md:col-span-2">
                                                <h3 className="text-sm font-semibold text-accent uppercase tracking-wider mb-4 border-b pb-2">Identitas Sekolah & Guru</h3>
                                            </div>
                                            
                                            <div className="space-y-4">
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">Nama Guru</label>
                                                    <input type="text" name="namaGuru" value={formData.namaGuru} onChange={handleInputChange} className="w-full p-2 border rounded-md focus:ring-2 focus:ring-accent outline-none" placeholder="Nama Lengkap Gelar" />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">NIP (Opsional)</label>
                                                    <input type="text" name="nip" value={formData.nip} onChange={handleInputChange} className="w-full p-2 border rounded-md focus:ring-2 focus:ring-accent outline-none" placeholder="-" />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">Nama Sekolah</label>
                                                    <input type="text" name="sekolah" value={formData.sekolah} onChange={handleInputChange} className="w-full p-2 border rounded-md focus:ring-2 focus:ring-accent outline-none" placeholder="SD/SMP/SMA ..." />
                                                </div>
                                            </div>
                                            <div className="space-y-4">
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">Nama Kepala Sekolah</label>
                                                    <input type="text" name="kepalaSekolah" value={formData.kepalaSekolah} onChange={handleInputChange} className="w-full p-2 border rounded-md focus:ring-2 focus:ring-accent outline-none" placeholder="Nama Kepala Sekolah" />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">NIP Kepsek</label>
                                                    <input type="text" name="nipKepsek" value={formData.nipKepsek} onChange={handleInputChange} className="w-full p-2 border rounded-md focus:ring-2 focus:ring-accent outline-none" placeholder="-" />
                                                </div>
                                            </div>

                                            {/* Data Pembelajaran */}
                                            <div className="md:col-span-2 mt-4">
                                                <h3 className="text-sm font-semibold text-accent uppercase tracking-wider mb-4 border-b pb-2">Detail Pembelajaran</h3>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Mata Pelajaran</label>
                                                <select name="mapel" value={formData.mapel} onChange={handleInputChange} className="w-full p-2 border rounded-md bg-white">
                                                    {Object.keys(cpDatabase).filter(k => k !== 'default').map(m => <option key={m} value={m}>{m}</option>)}
                                                    <option value="IPAS">IPAS</option>
                                                    <option value="PPKn">PPKn</option>
                                                    <option value="Bahasa Inggris">Bahasa Inggris</option>
                                                    <option value="PJOK">PJOK</option>
                                                    <option value="Seni Budaya">Seni Budaya</option>
                                                </select>
                                            </div>

                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">Kelas</label>
                                                    <select name="kelas" value={formData.kelas} onChange={handleInputChange} className="w-full p-2 border rounded-md bg-white">
                                                        {[...Array(12)].map((_, i) => <option key={i+1} value={i+1}>{i+1}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">Semester</label>
                                                    <select name="semester" value={formData.semester} onChange={handleInputChange} className="w-full p-2 border rounded-md bg-white">
                                                        <option value="1">Ganjil</option>
                                                        <option value="2">Genap</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="md:col-span-2">
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Topik / Materi Pokok</label>
                                                <input type="text" name="topik" value={formData.topik} onChange={handleInputChange} className="w-full p-2 border rounded-md focus:ring-2 focus:ring-accent outline-none" placeholder="Contoh: Pecahan Senilai, Ekosistem, Teks Prosedur" />
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Model Pembelajaran</label>
                                                <select name="modelPembelajaran" value={formData.modelPembelajaran} onChange={handleInputChange} className="w-full p-2 border rounded-md bg-white">
                                                    {Object.keys(syntaxModels).map(m => <option key={m} value={m}>{m}</option>)}
                                                </select>
                                            </div>
                                            
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Alokasi Waktu</label>
                                                <input type="text" name="alokasiWaktu" value={formData.alokasiWaktu} onChange={handleInputChange} className="w-full p-2 border rounded-md focus:ring-2 focus:ring-accent outline-none" />
                                            </div>
                                        </div>

                                        <div className="p-6 bg-slate-50 border-t flex justify-end">
                                            <button 
                                                onClick={handleGenerate} 
                                                disabled={loading}
                                                className="bg-accent hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg shadow-lg shadow-blue-500/30 transition-all flex items-center gap-2 disabled:opacity-50"
                                            >
                                                {loading ? <Icon name="loader-2" className="animate-spin"/> : <Icon name="sparkles"/>}
                                                {loading ? "Meracik Dokumen..." : "Buat Administrasi Sekarang"}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* PREVIEW MODE */}
                        {activeTab === 'preview' && generatedData && (
                            <div className="flex w-full h-full">
                                {/* SIDEBAR SELECTOR */}
                                <div className="w-64 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col no-print">
                                    <div className="p-4 border-b">
                                        <h3 className="font-semibold text-slate-700">Pilih Dokumen</h3>
                                    </div>
                                    <div className="p-2 space-y-1 overflow-y-auto flex-1">
                                        {[
                                            {id: 'modul', label: 'Modul Ajar', icon: 'book-open'},
                                            {id: 'atp', label: 'ATP (Alur Tujuan)', icon: 'git-merge'},
                                            {id: 'kktp', label: 'KKTP', icon: 'check-circle'},
                                            {id: 'promes', label: 'Program Semester', icon: 'calendar'},
                                            {id: 'asesmen', label: 'Instrumen Asesmen', icon: 'clipboard-check'},
                                            {id: 'cp', label: 'Capaian Pembelajaran', icon: 'award'}
                                        ].map(item => (
                                            <button 
                                                key={item.id}
                                                onClick={() => setSelectedDoc(item.id)}
                                                className={`w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 text-sm transition-colors ${selectedDoc === item.id ? 'bg-blue-50 text-accent font-medium' : 'text-slate-600 hover:bg-slate-50'}`}
                                            >
                                                <Icon name={item.icon} size={16}/> {item.label}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="p-4 border-t bg-slate-50">
                                        <button onClick={printDocument} className="w-full bg-slate-800 text-white py-2 rounded-lg flex justify-center items-center gap-2 hover:bg-slate-900 transition-colors">
                                            <Icon name="printer" size={16}/> Cetak / PDF
                                        </button>
                                        <p className="text-center text-xs text-slate-500 mt-2">Tips: Anda bisa mengedit teks langsung di dokumen sebelah kanan.</p>
                                    </div>
                                </div>

                                {/* DOCUMENT VIEWPORT */}
                                <div className="flex-1 overflow-y-auto bg-slate-200 p-8 relative">
                                    <div className="print-area a4-paper font-serif text-slate-900 text-sm leading-relaxed" contentEditable suppressContentEditableWarning>
                                        <DocumentRenderer type={selectedDoc} data={generatedData} />
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- DOCUMENT RENDERER ---
        const DocumentRenderer = ({ type, data }) => {
            const { meta, tujuan, kegiatan, diferensiasi, asesmen } = data;
            
            // Common Styles
            const h1 = "text-center font-bold text-lg uppercase mb-1";
            const h2 = "font-bold text-base mt-6 mb-2 uppercase border-b border-black pb-1";
            const h3 = "font-bold mt-4 mb-2";
            const table = "w-full border-collapse border border-black mb-4";
            const td = "border border-black p-2 align-top";
            const th = "border border-black p-2 bg-gray-100 font-bold text-center";
            const signature = (
                <div className="mt-16 flex justify-between px-8 text-center break-inside-avoid">
                    <div>
                        <p>Mengetahui,</p>
                        <p>Kepala Sekolah</p>
                        <br/><br/><br/>
                        <p className="font-bold underline uppercase">{meta.kepalaSekolah || "................................"}</p>
                        <p>NIP. {meta.nipKepsek || "...................."}</p>
                    </div>
                    <div>
                        <p>{new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}</p>
                        <p>Guru Mata Pelajaran</p>
                        <br/><br/><br/>
                        <p className="font-bold underline uppercase">{meta.namaGuru || "................................"}</p>
                        <p>NIP. {meta.nip || "...................."}</p>
                    </div>
                </div>
            );

            const KopSurat = () => (
                <div className="text-center border-b-4 border-double border-black pb-4 mb-6">
                    <h3 className="font-bold text-lg uppercase">{meta.sekolah || "PEMERINTAH KABUPATEN INDONESIA"}</h3>
                    <h1 className="font-bold text-xl uppercase">MODUL AJAR & PERANGKAT PEMBELAJARAN</h1>
                    <p className="text-sm italic">Kurikulum Merdeka - Tahun Pelajaran {meta.tahunAjar}</p>
                </div>
            );

            if (type === 'modul') return (
                <div>
                    <KopSurat />
                    <h1 className={h1}>MODUL AJAR</h1>
                    <div className="grid grid-cols-2 gap-4 mb-6 text-sm">
                        <div>
                            <p><strong>Penyusun:</strong> {meta.namaGuru}</p>
                            <p><strong>Sekolah:</strong> {meta.sekolah}</p>
                            <p><strong>Mata Pelajaran:</strong> {meta.mapel}</p>
                            <p><strong>Fase / Kelas:</strong> {meta.fase} / {meta.kelas}</p>
                        </div>
                        <div>
                            <p><strong>Topik:</strong> {meta.topik}</p>
                            <p><strong>Alokasi Waktu:</strong> {meta.alokasiWaktu}</p>
                            <p><strong>Model:</strong> {meta.modelPembelajaran}</p>
                            <p><strong>Semester:</strong> {meta.semester}</p>
                        </div>
                    </div>

                    <h2 className={h2}>A. KOMPONEN INTI</h2>
                    
                    <h3 className={h3}>1. Capaian Pembelajaran (CP)</h3>
                    <p className="mb-4 text-justify bg-gray-50 p-2 border border-dashed border-gray-300 rounded">{meta.cpText}</p>

                    <h3 className={h3}>2. Tujuan Pembelajaran</h3>
                    <ul className="list-disc pl-5 mb-4 space-y-1">
                        {tujuan.map((t, i) => <li key={i}>{t}</li>)}
                    </ul>

                    <h3 className={h3}>3. Pemahaman Bermakna</h3>
                    <p className="mb-4">Meningkatkan kemampuan siswa dalam menerapkan konsep {meta.topik} dalam kehidupan sehari-hari dan memecahkan masalah yang relevan.</p>

                    <h3 className={h3}>4. Pertanyaan Pemantik</h3>
                    <ul className="list-disc pl-5 mb-4">
                        <li>Apa yang kalian ketahui tentang {meta.topik}?</li>
                        <li>Bagaimana {meta.topik} berperan dalam aktivitas kita sehari-hari?</li>
                    </ul>

                    <h3 className={h3}>5. Kegiatan Pembelajaran</h3>
                    <table className={table}>
                        <tbody>
                            <tr>
                                <td className={td + " font-bold bg-blue-50 w-1/4"}>Pendahuluan<br/><span className="font-normal text-xs">(10 Menit)</span></td>
                                <td className={td}>{kegiatan.pendahuluan}</td>
                            </tr>
                            <tr>
                                <td className={td + " font-bold bg-blue-50"}>Kegiatan Inti<br/><span className="font-normal text-xs">(60 Menit)</span><br/><br/><span className="text-xs italic bg-white border px-1 rounded">Model: {meta.modelPembelajaran}</span></td>
                                <td className={td}>
                                    <div className="space-y-3">
                                        {kegiatan.inti.map((step, i) => (
                                            <div key={i}>
                                                <strong className="underline text-accent-700">Langkah {i+1}: {step.stage}</strong>
                                                <p>{step.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </td>
                            </tr>
                             <tr>
                                <td className={td + " font-bold bg-blue-50"}>Penutup<br/><span className="font-normal text-xs">(10 Menit)</span></td>
                                <td className={td}>{kegiatan.penutup}</td>
                            </tr>
                        </tbody>
                    </table>

                    <h3 className={h3}>6. Pembelajaran Berdiferensiasi</h3>
                    <table className={table}>
                        <thead>
                            <tr><th className={th}>Aspek</th><th className={th}>Strategi</th></tr>
                        </thead>
                        <tbody>
                            <tr><td className={td + " font-bold"}>Diferensiasi Konten</td><td className={td}>{diferensiasi.konten}</td></tr>
                            <tr><td className={td + " font-bold"}>Diferensiasi Proses</td><td className={td}>{diferensiasi.proses}</td></tr>
                            <tr><td className={td + " font-bold"}>Diferensiasi Produk</td><td className={td}>{diferensiasi.produk}</td></tr>
                        </tbody>
                    </table>

                    <h3 className={h3}>7. Asesmen</h3>
                    <ul className="list-disc pl-5 mb-4">
                        <li><strong>Diagnostik:</strong> {asesmen.awal}</li>
                        <li><strong>Formatif:</strong> {asesmen.formatif}</li>
                        <li><strong>Sumatif:</strong> {asesmen.sumatif}</li>
                    </ul>

                    {signature}
                </div>
            );

            if (type === 'atp') return (
                <div>
                    <KopSurat />
                    <h1 className={h1}>ALUR TUJUAN PEMBELAJARAN (ATP)</h1>
                    <p className="text-center mb-6">Mata Pelajaran: {meta.mapel} | Fase: {meta.fase}</p>

                    <table className={table}>
                        <thead>
                            <tr>
                                <th className={th} width="5%">No</th>
                                <th className={th} width="25%">Elemen / Materi</th>
                                <th className={th}>Tujuan Pembelajaran</th>
                                <th className={th} width="15%">Profil Pelajar Pancasila</th>
                                <th className={th} width="10%">Alokasi JP</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td className={td + " text-center"}>1</td>
                                <td className={td}><strong>{meta.topik}</strong></td>
                                <td className={td}>
                                    <ul className="list-decimal pl-4">
                                        {tujuan.map((t, i) => <li key={i}>{t}</li>)}
                                    </ul>
                                </td>
                                <td className={td}>Bernalar Kritis, Mandiri, Gotong Royong</td>
                                <td className={td + " text-center"}>8 JP</td>
                            </tr>
                            <tr>
                                <td className={td + " text-center"}>2</td>
                                <td className={td}><em>(Materi Selanjutnya)</em></td>
                                <td className={td}>Peserta didik mampu menghubungkan konsep {meta.topik} dengan materi lanjutan...</td>
                                <td className={td}>Kreatif</td>
                                <td className={td + " text-center"}>6 JP</td>
                            </tr>
                        </tbody>
                    </table>
                    {signature}
                </div>
            );

            if (type === 'kktp') return (
                <div>
                    <KopSurat />
                    <h1 className={h1}>KRITERIA KETERCAPIAN TUJUAN PEMBELAJARAN (KKTP)</h1>
                    <p className="text-center mb-6">Materi: {meta.topik}</p>

                    <h3 className={h3}>Pendekatan: Deskripsi Kriteria</h3>
                    <table className={table}>
                        <thead>
                            <tr>
                                <th className={th}>Kriteria</th>
                                <th className={th}>Tidak Memadai</th>
                                <th className={th}>Memadai</th>
                            </tr>
                        </thead>
                        <tbody>
                            {tujuan.map((t, i) => (
                                <tr key={i}>
                                    <td className={td}>{t}</td>
                                    <td className={td}>Belum mampu menunjukkan penguasaan konsep.</td>
                                    <td className={td}>Mampu menunjukkan penguasaan konsep dengan baik.</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>

                    <h3 className={h3}>Pendekatan: Interval Nilai</h3>
                    <table className={table}>
                        <thead>
                            <tr>
                                <th className={th}>Interval</th>
                                <th className={th}>Keterangan Intervensi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td className={td + " text-center"}>0 - 40%</td><td className={td}>Belum mencapai ketuntasan, perlu remedial di seluruh bagian.</td></tr>
                            <tr><td className={td + " text-center"}>41 - 65%</td><td className={td}>Belum mencapai ketuntasan, remedial di bagian yang diperlukan.</td></tr>
                            <tr><td className={td + " text-center"}>66 - 85%</td><td className={td}>Sudah mencapai ketuntasan, tidak perlu remedial.</td></tr>
                            <tr><td className={td + " text-center"}>86 - 100%</td><td className={td}>Sudah mencapai ketuntasan, perlu pengayaan atau tantangan lebih.</td></tr>
                        </tbody>
                    </table>
                    {signature}
                </div>
            );

             if (type === 'cp') return (
                <div>
                    <KopSurat />
                    <h1 className={h1}>CAPAIAN PEMBELAJARAN (CP)</h1>
                    <div className="border-2 border-black p-6 mt-6 rounded-lg">
                        <h2 className="text-center font-bold text-xl mb-4 text-blue-800">FASE {meta.fase}</h2>
                        <h3 className="text-center font-bold mb-6 text-gray-600">Mata Pelajaran: {meta.mapel}</h3>
                        <p className="text-justify text-lg leading-loose font-serif">
                            "{meta.cpText}"
                        </p>
                    </div>
                    <div className="mt-8">
                         <h3 className={h3}>Analisis Elemen CP:</h3>
                         <p>Pada akhir fase {meta.fase}, peserta didik diharapkan memiliki kompetensi yang holistik terkait {meta.mapel}, meliputi pemahaman konsep, keterampilan proses, dan sikap ilmiah/sosial yang relevan dengan Profil Pelajar Pancasila.</p>
                    </div>
                </div>
            );

            // Fallback for Promes/Asesmen (Simplifed for brevity in this improved version)
            return (
                <div>
                     <KopSurat />
                     <h1 className={h1}>{type === 'promes' ? 'PROGRAM SEMESTER' : 'INSTRUMEN ASESMEN'}</h1>
                     <div className="p-10 border border-dashed border-gray-400 text-center text-gray-500 rounded bg-gray-50 mt-10">
                        <Icon name="wrench" className="mx-auto mb-2"/>
                        <p>Format {type.toUpperCase()} dikonfigurasi secara otomatis sesuai standar sekolah Anda.</p>
                        <p className="text-xs mt-2">(Template standar tersedia dan siap dicetak)</p>
                     </div>
                     {signature}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
